[general]
ignore = "**/.git"

[authoritative-version-source]
type = "cargo"
path = "crates/ciia"

[file-updaters.'version.json']
type = "regex"
replacers = [
  { regexes = '("FullVersion": ")(.*)(")' },
]

[[update-version-sources]]
globs = "**"

[[update-files]]
globs = "version.json"
updater = "version.json"
