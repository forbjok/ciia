name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run workflow without actually publishing
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false
          python-version: ">=3.15"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Install Cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install LinuxDeploy
        uses: miurahr/install-linuxdeploy-action@v1.8.0

      - name: Build
        run: uv run build.py linux64 appimage

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          files: "dist/*"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
